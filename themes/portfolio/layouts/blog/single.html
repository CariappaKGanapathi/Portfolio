{{ define "main" }}
<section class="post">
  <div class="container">
    <article>
      <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ with .Date }}<time class="post-date" datetime="{{ .Format "2006-01-02" }}">{{ .Format "Jan 2, 2006" }}</time>{{ end }}
      </header>
      <div class="post-body">
        {{ .Content }}
      </div>
      <footer class="post-footer">
        <a href="{{ "blog/" | relURL }}" role="button" class="secondary">← All posts</a>
      </footer>
    </article>
  </div>
</section>
{{ end }}
